name: Archive integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate archive structure
        run: python scripts/validate_archive.py

      - name: Run WS-001 pipeline and Proof Lab tests
        run: python -m unittest discover -s projects/WS-001-qualified-tender-change-intelligence/tests -v
